name: loom

on:
  push:
    paths:
      - "loom/**"
      - ".github/workflows/loom.yml"
  pull_request:
    paths:
      - "loom/**"
      - ".github/workflows/loom.yml"

defaults:
  run:
    working-directory: loom

jobs:
  test:
    name: test (cgo-free)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"; echo "$out"; exit 1
          fi
      - name: go test -race
        # A cgo-free build cannot use -race, so run tests twice:
        # once cgo-free (the shipping config) and once with the race detector.
        run: go test ./...
      - name: go test (race detector)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  cross-compile:
    name: cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: build single binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/loom
