name: varvig

on:
  push:
    paths:
      - "varvig/**"
      - ".github/workflows/varvig.yml"
  pull_request:
    paths:
      - "varvig/**"
      - ".github/workflows/varvig.yml"

defaults:
  run:
    working-directory: varvig

jobs:
  test:
    name: test (cgo-free)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"; echo "$out"; exit 1
          fi
      - name: go test -race
        # A cgo-free build cannot use -race, so run tests twice:
        # once cgo-free (the shipping config) and once with the race detector.
        run: go test ./...
      - name: go test (race detector)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: conformance gate
        # The frozen-format suite must pass for the shipping build (design §4.7).
        run: |
          go build -o varvig ./cmd/varvig
          ./varvig conform

      - name: MCP annotation + scope smoke test
        # Drive the real binary's MCP handshake and assert the directory
        # submission blockers (MCP spec §9): every tool carries a title and the
        # applicable hints, the surface is exactly the varvig_* set the registry
        # advertises (tools/gate-tools.json), and no *promote* tool exists. The
        # gate has no destructive agent-facing tool.
        run: python3 tools/mcp-smoke.py ./varvig mcp --standalone

  cross-compile:
    name: cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: build single binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/varvig

  interop:
    name: cross-version interop
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history/tags to build older versions
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: build current binary
        run: go build -o /tmp/varvig-current ./cmd/varvig
      - name: cross-version conformance matrix
        # Every conformance-bearing release must satisfy the same golden suite
        # (design §4.7). This builds each such release found in history and runs
        # its `conform` against the golden artifact; the current build always
        # runs. Older tags predating the suite are skipped, so the matrix grows
        # as releases accrue without ever failing on their absence.
        run: |
          set -e
          echo "== current =="
          /tmp/varvig-current conform
          current_id=$(/tmp/varvig-current conform --id)
          for ref in $(git tag --sort=-creatordate | head -n 5); do
            echo "== $ref =="
            if git worktree add -q /tmp/wt-$ref "$ref" 2>/dev/null; then
              if (cd /tmp/wt-$ref/varvig && go build -o /tmp/varvig-$ref ./cmd/varvig 2>/dev/null) \
                 && /tmp/varvig-$ref conform >/dev/null 2>&1; then
                other_id=$(/tmp/varvig-$ref conform --id)
                echo "  suite id: $other_id"
                if [ "$other_id" != "$current_id" ]; then
                  echo "  note: suite id differs from current ($current_id) — releases may legitimately extend the suite"
                fi
              else
                echo "  skipped: $ref predates the conformance suite"
              fi
              git worktree remove -f /tmp/wt-$ref 2>/dev/null || true
            fi
          done
